spring.application.name=Proyecto

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/toolrent_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:8846}

spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
# Desactivar el log SQL en producción/stress — cada log bajo alta concurrencia
# introduce contención en el appender y reduce throughput significativamente.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# Keycloak settings (client secret read from environment variable KEYCLOAK_CLIENT_SECRET)
keycloak.auth-server-url=${KEYCLOAK_URL:http://localhost:9090}
keycloak.realm=ToolRent
keycloak.client-id=toolrent-backend
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}


spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs

# OAuth2 token endpoint (used by backend when contacting Keycloak)
keycloak.token-uri=${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/token

# ─── HikariCP — Pool de conexiones ────────────────────────────────────────────
# Aumentado de 20 → 50 para absorber la concurrencia de los tests de stress.
# Regla práctica: max_pool ≈ (núcleos_CPU × 2) + disco_IO_threads.
# Confirmar que PostgreSQL tenga max_connections >= 60 (50 pool + 10 admin/keycloak).
spring.datasource.hikari.maximum-pool-size=50
# Reducido de 30s → 8s: fallar rápido bajo sobrecarga severa es mejor que
# acumular miles de hilos bloqueados esperando una conexión.
spring.datasource.hikari.connection-timeout=8000
# Tiempo máximo de vida de una conexión (ms) — 10 min
spring.datasource.hikari.max-lifetime=600000
# Tiempo máximo que una conexión puede estar idle antes de ser cerrada — 5 min
spring.datasource.hikari.idle-timeout=300000
# Mínimo de conexiones mantenidas en el pool cuando está idle
spring.datasource.hikari.minimum-idle=10

# ─── Tomcat — Thread Pool ──────────────────────────────────────────────────────
# Spring Boot default es 200 hilos; aumentar para absorber picos de concurrencia.
server.tomcat.threads.max=400
# Hilos de reserva siempre activos para responder sin latencia de creación.
server.tomcat.threads.min-spare=20
# Cola de conexiones TCP pendientes cuando todos los hilos están ocupados.
# Evita rechazos de conexión (RST) bajo ráfagas cortas de tráfico.
server.tomcat.accept-count=200
